[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "albion-market-tracker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "mss>=9.0",
    "pillow>=10.0",
    "numpy>=1.24",
    "rapidocr-onnxruntime>=1.2",
]

[tool.setuptools]
packages = ["albion_tracker"]
