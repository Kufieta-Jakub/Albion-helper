services:
  db:
    image: postgres:16
    container_name: albion_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-albion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-albion}
      POSTGRES_DB: ${POSTGRES_DB:-albion_market}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - albion_pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  albion_pgdata:
